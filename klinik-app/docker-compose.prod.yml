version: '3.8'

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: klinik_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./backend/docker/php.ini:/usr/local/etc/php/conf.d/app.ini
      - ./backend/storage:/var/www/storage
    networks:
      - klinik_net
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: klinik_frontend
    restart: unless-stopped
    networks:
      - klinik_net
    depends_on:
      - app
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN:-klinik.elzahrawimedikacihaurbeuti.com}/api/v1

  nginx:
    image: nginx:alpine
    container_name: klinik_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - klinik_net
    depends_on:
      - app
      - frontend

  postgres:
    image: postgres:16-alpine
    container_name: klinik_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-klinik_db}
      POSTGRES_USER: ${DB_USERNAME:-klinik_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - klinik_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-klinik_user} -d ${DB_DATABASE:-klinik_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  certbot:
    image: certbot/certbot
    container_name: klinik_certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    profiles:
      - ssl

networks:
  klinik_net:
    driver: bridge

volumes:
  postgres_data:
