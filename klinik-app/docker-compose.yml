version: '3.8'

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: klinik_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./backend/docker/php.ini:/usr/local/etc/php/conf.d/app.ini
    networks:
      - klinik_net
    depends_on:
      - postgres
      - redis
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-klinik_db}
      - DB_USERNAME=${DB_USERNAME:-klinik_user}
      - DB_PASSWORD=${DB_PASSWORD:-klinik_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=sync

  nginx:
    image: nginx:alpine
    container_name: klinik_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - klinik_net
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: klinik_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-klinik_db}
      POSTGRES_USER: ${DB_USERNAME:-klinik_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-klinik_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - klinik_net

  redis:
    image: redis:7-alpine
    container_name: klinik_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - klinik_net

networks:
  klinik_net:
    driver: bridge

volumes:
  postgres_data:
